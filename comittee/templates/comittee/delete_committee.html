<!doctype html>
<html lang="en">
  {% load static %}
  <head>
    <meta charset="UTF-8" />
    <title>Delete Athlete</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
      integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
      crossorigin="anonymous"
    />
  </head>
  <style>
    .inner {
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .inner .circle {
      width: 300px;
      height: auto;
      text-align: center;
      flex: 20;
    }
  </style>
  <body>
    <div class="container">
      <div class="inner">
        <div class="circle">
          <h6>Are you sure you want to delete official;-</h6>
          <h1>{{ comittee.fname }} {{ comittee.lname }}?</h1>
          <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Delete</button>
            <a href="{% url 'committees' %}" class="btn btn-secondary"
              >Cancel</a
            >
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
