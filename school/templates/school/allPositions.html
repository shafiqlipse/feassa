{% extends "dashboard/dashboard.html" %} {%load static%}
<!---->
{% block title %} Schools{% endblock %}
<!---->

{%block content%}
<div class="page-container">
  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-body">
          <h1 class="header-title">SCHOOLS</h1>

          <table
            id="schools"
            class="table table-striped dt-responsive nowrap w-100"
          >
            <thead>
              <tr>
                <th>School</th>
                <th>Sport</th>
                <th>Gender</th>
                <th>Position</th>
              </tr>
            </thead>

            <tbody>
              {% for position in positions%}
              <tr>
                <td>
                  <a href="">{{position.school}}</a>
                </td>
                <td>{{ position.sport }}</td>
                <td>{{ position.gender }}</td>
                <td>{{ position.position }}</td>
              </tr>

              {%endfor%}
            </tbody>
          </table>
        </div>
        <!-- end card body-->
      </div>
      <!-- end card -->
    </div>
    <!-- end col-->
  </div>
  <!-- end row-->
</div>
{% endblock %}
