<html>
  <head>
    <style>
      @page {
        size: a4 portrait;
        /*background-image: url("https://feassa.org/merit.jpg");*/
        @frame header_frame {
          /* Static Frame */
          -pdf-frame-content: header_content;

          width: 512pt;
          top: 50pt;
          height: 40pt;
          text-align: center;
        }
        @frame content_frame {
          /* Content Frame */

          width: 512pt;
          top: 360pt;
          height: 632pt;
          text-align: center;
        }
      }
      .school {
        page-break-after: always;
      }
      .school h2 {
        font-size: 35px;
        font-family: Courier, serif;
        line-height: 18pt;
        padding-left: 50pt;
        padding-right: 50pt;
      }
      .school h3 {
        font-size: 35px;
        font-family: Courier, serif;
        line-height: 18pt;
      }
      .school p {
        font-size: 20px;
        font-family: georgia, serif;
        line-height: 18pt;
      }
      #content {
        font-size: 35px;
        font-family: Courier, serif;
        line-height: 18pt;
        padding-left: 50pt;
        padding-right: 50pt;
        font-weight: bold;
        width: 212pt;
        margin-top: 190pt;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <div class="header" style="text-align: center">
      <div class="athletes">
        {% for posit in posiytions %}
        <div class="school">
          <h2>{{posit.school|upper}}</h2>
          <p>for participating in</p>
          <h3>
            {{posit.sport|upper}} {% if posit.gender == 'Male' %}BOYS {%else %}
            GIRLS{% endif %}
          </h3>
          <div id="content">in position {{posit.position}}</div>
        </div>
        <!-- Content for Static Frame 'footer_frame' -->

        {% endfor %}
      </div>
    </div>
  </body>
</html>
