<html lang="en">
  {% load static %}
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Certificate</title>
  </head>

  <body>
    <style>
      @page {
        size: letter portrait;
        width: 512pt;
        height: 692pt;
        background-image: url("https://feassa.org/cert.jpg");
      }
      body {
        margin: 0;
        padding: 0;
      }
      .athlete-table {
        border-collapse: collapse;
      }
      .header .athletes table tbody tr {
        padding-top: 175.5pt;
      }
      .header .athletes table tbody tr td .athlete-info {
        padding-left: 50pt;
      }
      .header .athletes table tbody tr .athlete-cell .athlete-info {
        text-align: center;
        font-size: 16px;
      }
      .header .athletes table tbody tr td .athlete-image {
        text-align: center;
      }
      .header .athletes table tbody tr .athlete-cell .athlete-image img {
        width: 120px;
        height: 120px;
        margin-left: 120pt;
      }
      .header .athletes table tbody tr .athlete-cell .athlete-name {
        text-align: center;
        font-family: Geneva, sans;
        font-style: italic;
        font-weight: bold;
        font-size: 17px;
      }
    </style>
    <div class="header">
      <div class="athletes">
        <table class="athlete-table">
          <tbody>
            {% for athlete in athletes %}
            <tr>
              <td class="athlete-cell">
                <div class="athlete-info">
                  <span class="athlete-name"
                    >{{ athlete.fname|upper }} {{athlete.lname|upper}} </span
                  ><br />

                  <span>{{ athlete.school|upper }}</span><br />
                  <span
                    >{{ athlete.sport|upper }} ({{athlete.gender|upper}})</span
                  ><br />
                </div>
              </td>
              <td class="athlete-cell">
                <div class="athlete-image">
                  {% if athlete.photo %}
                  <img
                    src="{{ athlete.photo.path }}"
                    alt="{{ athlete.first_name }}"
                  />
                  {% else %}
                  <img
                    src="{% static 'images/profile.png' %}"
                    alt="{{ athlete.last_name }}"
                  />
                  {% endif %}
                </div>
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
